<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogger Homes</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-white">
	<div class="container mt-5">
		<h2 class="bg-info text-center mb-4">Wlecome To Safety Tracer
			Blogs</h2>

		<div class="d-flex justify-content-end mb-3">
			<a href="/newPost" class="btn btn-success">+New Post</a>
		</div>

		<div class="card p-3 mb-4">
			<h5>Update or Delete a Post by ID</h5>
			<div class="row g-2">
				<div class="col-md-4">
					<input type="number" id="postIdInput" class="form-control"
						placeholder="Enter Post ID">
				</div>

				<div class="col-md-2">
					<button onclick="editPost()" class="btn btn-primary w-100">Edit
						Post</button>
				</div>

				<div class="col-md-2">
					<button onclick="deletePost()" class="btn btn-danger w-100">Delete
						Post</button>
				</div>
			</div>
		</div>

		<!-- Post Table -->
		<table class="table table-bordered table-striped">
			<thead class="table-dark">
				<tr><th>ID</th>
					<th>Title</th>
					<th>Author</th>
					<th>Content</th>
					<th>Date</th>
				</tr>
			</thead>
			
			<tbody>
			<tr th:each="post : ${postList}">
			<td th:text="${post.id}">ID</td>
			<td th:text="${post.tittle}">Post Title</td>
			<td th:text="${post.author}">Author</td>
			<td th:text="${post.content}">Content</td>
			<td th:text="${post.date}">Date</td>
			</tr>
			</tbody>
		</table>

	</div>

	<script>
	function editPost(){
		const id=document.getElementById("postIdInput").value;
		if(id){
			window.location.href="/edit/"+id;
		}else{
			alert("please enter a valid Post ID.")
		}
	}
	function deletePost(){
		const id=document.getElementById("postIdInput").value;
		if(id && confirm("Are you sure, that you want to delete this post ID "+id+"?")){
			window.location.href="/delete/"+id;
		}else{
			alert("please enter a valid Post ID.")
		}
	}
	</script>
	
</body>
</html>
